name: Android APK and KernelSU ZIP
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Verify KernelSU shell scripts
        run: |
          set -e
          for f in module/customize.sh module/post-fs-data.sh module/service.sh module/uninstall.sh module/bin/status.sh; do sh -n "$f"; done
          grep -q '^id=gorilla_pubg_companion$' module/module.prop
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Package KernelSU module
        run: |
          mkdir -p dist
          cd module
          zip -qr ../dist/GORILLA-KernelSU-Companion-0.1.0.zip .
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gorilla-companion-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            dist/GORILLA-KernelSU-Companion-0.1.0.zip
          if-no-files-found: error
          retention-days: 14
